server:
  port: 8086

spring:
  application:
    name: payment-service
  config:
    import: configserver:http://localhost:8888
  datasource:
    url: jdbc:mysql://localhost:3306/homefix_payments
    username: root
    password: Vikas@9100
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

razorpay:
  # Read from environment variables — never commit real keys.
  # Get test keys from https://dashboard.razorpay.com/app/keys (Test Mode).
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
