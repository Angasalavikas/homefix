server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # ---------- Auth Service ----------
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2

            # ---------- Customer Service ----------
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - StripPrefix=2

            # ---------- Provider Service ----------
            - id: provider-service
              uri: lb://provider-service
              predicates:
                - Path=/api/providers/**
              filters:
                - StripPrefix=2

            # ---------- Service Catalog ----------
            - id: service-catalog-service
              uri: lb://service-catalog-service
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2

            # ---------- Booking Service ----------
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
              filters:
                - StripPrefix=1

            # ---------- Payment Service ----------
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1

            # ---------- Notification Service ----------
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

            # ---------- Admin Service ----------
            - id: admin-service
              uri: lb://admin-service
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=1

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway,health
